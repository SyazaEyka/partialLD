<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Cabutan Bertuah</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tone.js untuk bunyi sintetik (rolling tick & fanfare menang) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <!-- Canvas Confetti untuk kesan menang -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        /* Gaya tambahan yang tidak dirangkumi Tailwind */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #1a0b2e;
        }

        /* Kelas animasi daun luruh */
        .leaf {
            position: fixed;
            top: -10%;
            z-index: 0;
            pointer-events: none;
            user-select: none;
            animation-name: fall, sway;
            animation-timing-function: linear, ease-in-out;
            animation-iteration-count: infinite, infinite;
            animation-direction: normal, alternate;
        }

        @keyframes fall {
            0% { top: -10%; }
            100% { top: 110%; }
        }

        @keyframes sway {
            0% { transform: translateX(-20px) rotate(0deg); }
            100% { transform: translateX(20px) rotate(360deg); }
        }

        /* Penambahbaikan visual scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1); 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3); 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.5); 
        }
    </style>
</head>
<body class="text-white overflow-hidden bg-gradient-to-br from-amber-950 via-orange-950 to-slate-900 h-screen flex flex-col relative">

    <!-- Kontena Daun Luruh (Falling Leaves) -->
    <div id="leaves-container" class="absolute inset-0 overflow-hidden z-0"></div>

    <div class="relative z-10 flex flex-col md:flex-row h-full p-4 md:p-8 gap-8 w-full max-w-7xl mx-auto">
        
        <!-- Bahagian Kiri: Roda & Butang -->
        <div class="flex-1 flex flex-col items-center justify-center">
            
            <div class="text-center mb-8">
                <h1 class="text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 via-yellow-500 to-orange-500 drop-shadow-lg uppercase tracking-wider">
                    Cabutan Bertuah
                </h1>
                <p id="rangeDisplay" class="text-yellow-200/80 mt-2">Nombor 0001 - 1000</p>
            </div>

            <!-- Tetapan Nombor -->
            <div class="bg-black/30 p-4 rounded-xl mb-8 flex flex-wrap items-center justify-center gap-4 border border-white/10 shadow-inner w-full max-w-md relative z-20">
                <div class="flex items-center gap-2">
                    <label class="text-sm text-yellow-200 font-semibold">Mula:</label>
                    <input type="number" id="minNum" value="1" min="1" class="w-20 bg-black/50 text-white rounded-lg px-2 py-1 outline-none focus:ring-2 focus:ring-yellow-500 border border-white/20 text-center font-mono">
                </div>
                <div class="flex items-center gap-2">
                    <label class="text-sm text-yellow-200 font-semibold">Tamat:</label>
                    <input type="number" id="maxNum" value="1000" min="1" class="w-24 bg-black/50 text-white rounded-lg px-2 py-1 outline-none focus:ring-2 focus:ring-yellow-500 border border-white/20 text-center font-mono">
                </div>
                <button onclick="applyNumberSettings()" class="px-5 py-1.5 bg-gradient-to-r from-yellow-600 to-orange-600 hover:from-yellow-500 hover:to-orange-500 text-white text-sm font-bold rounded-lg transition-all shadow hover:shadow-lg hover:scale-105 active:scale-95">Set Semula</button>
            </div>

            <!-- Kontena Roda -->
            <div class="relative aspect-square w-[280px] sm:w-[384px] shrink-0 mb-8 flex justify-center items-center rounded-full">
                <!-- Roda Canvas -->
                <canvas id="wheelCanvas" class="absolute w-full h-full rounded-full shadow-[0_0_50px_rgba(234,179,8,0.3)] border-4 border-yellow-600/50 bg-black/20" width="800" height="800"></canvas>
                
                <!-- Paparan Nombor di Tengah Roda -->
                <div class="absolute w-36 h-36 bg-gradient-to-br from-white to-gray-200 rounded-full flex items-center justify-center shadow-[inset_0_-5px_15px_rgba(0,0,0,0.3),0_10px_20px_rgba(0,0,0,0.5)] border-8 border-yellow-500 z-10 transition-transform duration-300" id="centerDisplay">
                    <span id="centerNumber" class="text-4xl font-black text-gray-800 tracking-widest drop-shadow-sm font-mono">----</span>
                </div>
                
                <!-- Penunjuk (Pointer) di atas -->
                <div class="absolute -top-6 z-20 drop-shadow-xl" style="left: 50%; transform: translateX(-50%);">
                    <div class="w-0 h-0 border-l-[20px] border-l-transparent border-r-[20px] border-r-transparent border-t-[40px] border-t-red-600"></div>
                </div>
            </div>

            <!-- Butang Mula -->
            <button id="spinBtn" onclick="startSpin()" class="group relative px-10 py-4 bg-gradient-to-r from-yellow-500 to-orange-600 text-white font-bold rounded-full shadow-xl hover:scale-105 hover:shadow-2xl transition-all duration-300 text-2xl uppercase tracking-widest border-2 border-yellow-300 overflow-hidden">
                <span class="relative z-10">Mula Roda!</span>
                <div class="absolute inset-0 h-full w-full bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300"></div>
            </button>
            <p id="statusMsg" class="mt-4 text-orange-300 text-sm h-6"></p>

        </div>

        <!-- Bahagian Kanan: Senarai Nombor Yang Telah Dicabut -->
        <div class="w-full md:w-96 bg-black/40 rounded-3xl p-6 flex flex-col border border-white/10 backdrop-blur-md shadow-2xl">
            <div class="flex items-center justify-between mb-6 pb-4 border-b border-white/20">
                <h2 class="text-2xl font-bold text-yellow-400">Telah Dicabut</h2>
                <div class="bg-white/10 px-4 py-1 rounded-full text-yellow-300 font-bold border border-white/20">
                    <span id="drawnCount">0</span>
                </div>
            </div>
            
            <div id="drawnList" class="flex-1 overflow-y-auto flex flex-col gap-3 pr-2">
                <!-- Status sementara data dimuatkan -->
                <div id="emptyState" class="text-center text-white/60 font-semibold animate-pulse mt-10">Menyemak rekod lepas...</div>
            </div>
        </div>
        
    </div>

    <!-- TUKAR KEPADA TYPE="MODULE" UNTUK FIREBASE & SIMPANAN -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- 0. FIREBASE SETUP (PENYIMPANAN CLOUD) ---
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        let userId = null;
        let dbDocRef = null;

        // --- 1. SETUP DATA NOMBOR ---
        let availableNumbers = [];
        let drawnNumbers = [];
        
        // Fungsi Muat Turun (Load) dari Cloud
        async function loadState() {
            if (!userId) return;
            const docSnap = await getDoc(dbDocRef);
            
            if (docSnap.exists()) {
                const data = docSnap.data();
                availableNumbers = data.availableNumbers || [];
                drawnNumbers = data.drawnNumbers || [];
                const min = data.min || 1;
                const max = data.max || 1000;
                
                // Kemas kini input box
                document.getElementById('minNum').value = min;
                document.getElementById('maxNum').value = max;
                
                const padLength = Math.max(4, String(max).length);
                const minStr = String(min).padStart(padLength, '0');
                const maxStr = String(max).padStart(padLength, '0');
                document.getElementById('rangeDisplay').innerText = `Nombor ${minStr} - ${maxStr}`;
                
                // Kemas kini senarai ui yang telah menang
                document.getElementById('drawnCount').innerText = drawnNumbers.length;
                const listContainer = document.getElementById('drawnList');
                listContainer.innerHTML = '';
                
                if (drawnNumbers.length === 0) {
                    listContainer.innerHTML = '<div id="emptyState" class="text-center text-white/40 italic mt-10">Belum ada cabutan dilakukan.</div>';
                } else {
                    drawnNumbers.forEach((num, index) => {
                        // Papar rekod sedia ada ke dalam senarai tanpa animasi pusingan
                        appendDrawnUI(num, drawnNumbers.length - index, false);
                    });
                }
                document.getElementById('statusMsg').innerText = "Rekod lama dijumpai. Sedia untuk mula!";
            } else {
                // Tiada rekod dijumpai, jana baharu
                window.generateNumbers(1, 1000);
            }
        }

        // Fungsi Simpan (Save) ke Cloud
        async function saveState() {
            if (!userId) return;
            try {
                await setDoc(dbDocRef, {
                    availableNumbers,
                    drawnNumbers,
                    min: document.getElementById('minNum').value,
                    max: document.getElementById('maxNum').value
                });
            } catch (e) {
                console.error("Gagal menyimpan data:", e);
            }
        }

        window.generateNumbers = async function(min, max) {
            availableNumbers = [];
            drawnNumbers = [];
            
            const padLength = Math.max(4, String(max).length);

            for (let i = min; i <= max; i++) {
                availableNumbers.push(String(i).padStart(padLength, '0'));
            }
            
            const minStr = String(min).padStart(padLength, '0');
            const maxStr = String(max).padStart(padLength, '0');
            document.getElementById('rangeDisplay').innerText = `Nombor ${minStr} - ${maxStr}`;
            
            const centerDisplay = document.getElementById('centerNumber');
            centerDisplay.innerText = "----";
            centerDisplay.classList.remove('text-green-600', 'scale-125');
            document.getElementById('drawnCount').innerText = "0";
            document.getElementById('drawnList').innerHTML = '<div id="emptyState" class="text-center text-white/40 italic mt-10">Belum ada cabutan dilakukan.</div>';
            document.getElementById('statusMsg').innerText = "Julat nombor dikemaskini. Sedia untuk mula!";
            
            await saveState(); // Simpan fresh state
        };

        window.applyNumberSettings = function() {
            if (isSpinning) {
                document.getElementById('statusMsg').innerText = "Sila tunggu roda berhenti dahulu.";
                return;
            }
            const min = parseInt(document.getElementById('minNum').value) || 1;
            const max = parseInt(document.getElementById('maxNum').value) || 1000;
            
            if (min >= max) {
                document.getElementById('statusMsg').innerText = "Ralat: Nombor 'Tamat' mesti lebih besar.";
                return;
            }
            
            // Generate dan padam data lama
            window.generateNumbers(min, max);
        };

        // --- 2. SETUP AUDIO (TONE.JS) ---
        let isAudioInit = false;
        let tickSynth;
        let winSynth;

        async function initAudio() {
            if (isAudioInit) return;
            await Tone.start();
            tickSynth = new Tone.NoiseSynth({
                noise: { type: 'pink' },
                envelope: { attack: 0.001, decay: 0.05, sustain: 0 }
            }).toDestination();
            winSynth = new Tone.PolySynth(Tone.Synth, {
                oscillator: { type: "sawtooth" },
                envelope: { attack: 0.05, decay: 0.2, sustain: 0.8, release: 1 }
            }).toDestination();
            isAudioInit = true;
        }

        function playTick() {
            if (isAudioInit && tickSynth) tickSynth.triggerAttackRelease("32n");
        }

        function playWinSound() {
            if (isAudioInit && winSynth) {
                const now = Tone.now();
                winSynth.triggerAttackRelease("C4", "8n", now);
                winSynth.triggerAttackRelease("E4", "8n", now + 0.1);
                winSynth.triggerAttackRelease("G4", "8n", now + 0.2);
                winSynth.triggerAttackRelease(["C5", "E5", "G5"], "2n", now + 0.3);
            }
        }

        // --- 3. SETUP CANVAS RODA ---
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const numSegments = 24; 
        const colors = [
            '#eab308', '#d97706', '#b45309', '#92400e', '#78350f', '#451a03',
            '#eab308', '#d97706', '#b45309', '#92400e', '#78350f', '#451a03',
            '#eab308', '#d97706', '#b45309', '#92400e', '#78350f', '#451a03',
            '#eab308', '#d97706', '#b45309', '#92400e', '#78350f', '#451a03'
        ];
        let currentAngle = 0;
        let isSpinning = false;

        function drawWheel(rotation = 0) {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = canvas.width / 2;
            const anglePerSegment = (Math.PI * 2) / numSegments;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < numSegments; i++) {
                const startAngle = rotation + i * anglePerSegment;
                const endAngle = rotation + (i + 1) * anglePerSegment;

                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, startAngle, endAngle);
                ctx.closePath();
                ctx.fillStyle = colors[i];
                ctx.fill();
                
                ctx.lineWidth = 4;
                ctx.strokeStyle = "rgba(255, 255, 255, 0.2)";
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(centerX + Math.cos(startAngle) * (radius - 15), centerY + Math.sin(startAngle) * (radius - 15), 6, 0, Math.PI * 2);
                ctx.fillStyle = "rgba(255,255,255,0.8)";
                ctx.fill();
            }
        }
        drawWheel();

        // --- 4. LOGIK PUTARAN ---
        window.startSpin = async function() {
            if (isSpinning) return;
            if (!userId) {
                document.getElementById('statusMsg').innerText = "Sistem awan sedang dimuatkan, sila tunggu...";
                return;
            }
            if (availableNumbers.length === 0) {
                document.getElementById('statusMsg').innerText = "Semua nombor telah dicabut!";
                return;
            }

            isSpinning = true;
            document.getElementById('statusMsg').innerText = "Roda sedang berputar...";
            document.getElementById('spinBtn').classList.add('opacity-50', 'cursor-not-allowed');
            
            await initAudio();

            const winnerIndex = Math.floor(Math.random() * availableNumbers.length);
            const winningNumber = availableNumbers[winnerIndex];

            const spinDuration = 5000 + Math.random() * 2000;
            const startTimestamp = performance.now();
            const startAngle = currentAngle;
            const totalRotation = Math.PI * 2 * (15 + Math.random() * 5);
            let lastTickSegment = 0;

            const centerDisplay = document.getElementById('centerNumber');
            centerDisplay.classList.remove('text-green-600', 'scale-125');

            function animateSpin(timestamp) {
                const elapsed = timestamp - startTimestamp;
                let progress = elapsed / spinDuration;
                if (progress > 1) progress = 1;

                const easeOut = 1 - Math.pow(1 - progress, 4);
                currentAngle = startAngle + (totalRotation * easeOut);
                drawWheel(currentAngle);

                const currentSegment = Math.floor((currentAngle / (Math.PI * 2)) * numSegments);
                if (currentSegment > lastTickSegment) {
                    playTick();
                    lastTickSegment = currentSegment;
                    document.getElementById('centerDisplay').style.transform = 'scale(0.95)';
                    setTimeout(() => { document.getElementById('centerDisplay').style.transform = 'scale(1)'; }, 50);
                }

                if (progress < 0.95) {
                    const randIndex = Math.floor(Math.random() * availableNumbers.length);
                    centerDisplay.innerText = availableNumbers[randIndex];
                } else {
                    centerDisplay.innerText = winningNumber;
                }

                if (progress < 1) {
                    requestAnimationFrame(animateSpin);
                } else {
                    finishSpin(winningNumber, winnerIndex);
                }
            }

            requestAnimationFrame(animateSpin);
        };

        // --- 5. LOGIK TAMAT PUTARAN ---
        async function finishSpin(winnerNum, winnerIndex) {
            isSpinning = false;
            document.getElementById('spinBtn').classList.remove('opacity-50', 'cursor-not-allowed');
            document.getElementById('statusMsg').innerText = "Selesai! Tekan lagi untuk cabutan seterusnya.";
            
            playWinSound();
            confetti({
                particleCount: 150,
                spread: 80,
                origin: { y: 0.6 },
                colors: ['#FFD700', '#FFA500', '#FF4500', '#ffffff']
            });

            const centerDisplay = document.getElementById('centerNumber');
            centerDisplay.innerText = winnerNum;
            centerDisplay.classList.add('text-green-600', 'scale-125', 'transition-all', 'duration-500');

            availableNumbers.splice(winnerIndex, 1);
            drawnNumbers.unshift(winnerNum);
            
            appendDrawnUI(winnerNum, drawnNumbers.length, true);
            await saveState(); // Simpan ke Cloud pangkalan data setiap kali habis cabutan
        }

        // --- 6. KEMASKINI UI (SENARAI CABUTAN) ---
        function appendDrawnUI(number, indexPos, animate) {
            document.getElementById('drawnCount').innerText = drawnNumbers.length;
            const listContainer = document.getElementById('drawnList');
            const emptyState = document.getElementById('emptyState');
            if (emptyState) emptyState.remove();

            const item = document.createElement('div');
            let baseClasses = 'bg-gradient-to-r from-yellow-500 to-amber-600 rounded-xl p-3 shadow-lg flex items-center justify-between';
            
            if (animate) {
                baseClasses += ' opacity-0 transform translate-y-4 transition-all duration-500';
            }
            item.className = baseClasses;
            
            item.innerHTML = `
                <div class="flex items-center gap-3">
                    <div class="bg-black/20 rounded-full w-8 h-8 flex items-center justify-center font-bold text-white/80 text-sm">
                        #${indexPos}
                    </div>
                    <span class="text-3xl font-black text-white tracking-widest font-mono drop-shadow-md">
                        ${number}
                    </span>
                </div>
                <div class="text-xl">🎉</div>
            `;
            
            if (animate) {
                listContainer.prepend(item);
                void item.offsetWidth;
                item.classList.remove('opacity-0', 'translate-y-4');
            } else {
                listContainer.appendChild(item); // Semasa page load, masukkan secara senyap
            }
        }

        // --- 7. AKSESORI: DAUN LURUH ---
        const leavesContainer = document.getElementById('leaves-container');
        const leafIcons = ['🍂', '🍁', '🍃', '✨', '🔸'];

        function createLeaf() {
            const leaf = document.createElement('div');
            leaf.className = 'leaf';
            leaf.innerText = leafIcons[Math.floor(Math.random() * leafIcons.length)];
            const size = Math.random() * 20 + 15;
            const leftPos = Math.random() * 100;
            const duration = Math.random() * 8 + 7;
            const delay = Math.random() * 5;
            
            leaf.style.fontSize = `${size}px`;
            leaf.style.left = `${leftPos}vw`;
            leaf.style.animationDuration = `${duration}s, ${duration/2}s`;
            leaf.style.animationDelay = `${delay}s, ${delay}s`;
            leaf.style.opacity = Math.random() * 0.5 + 0.3;
            
            leavesContainer.appendChild(leaf);
            setTimeout(() => {
                if(leaf.parentNode === leavesContainer) leaf.remove();
            }, (duration + delay) * 1000);
        }

        setInterval(createLeaf, 600);
        for(let i=0; i<15; i++) createLeaf();

        // --- 8. MULAKAN SISTEM & PENYIMPANAN CLOUD ---
        async function initSystem() {
            try {
                // Log masuk sistem secara senyap menggunakan Authentication selamat
                if (typeof __initial_auth_token !== 'undefined') {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                
                userId = auth.currentUser.uid;
                // Path selamat untuk simpanan peribadi anda
                dbDocRef = doc(db, 'artifacts', appId, 'users', userId, 'draw_data', 'main_state');
                
                // Semak dan sambung sesi sebelum ini
                await loadState();
                
            } catch (e) {
                console.error("Ralat pangkalan data:", e);
                // Jika offline atau ralat, ia tetap boleh digunakan seperti biasa
                window.generateNumbers(1, 1000);
            }
        }

        // Mulakan sebaik sahaja halaman siap dimuatkan
        initSystem();

    </script>
</body>
</html>
